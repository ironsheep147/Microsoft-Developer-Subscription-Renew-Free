name: MSO_E5_Dev_AutoRenew

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '10 */2 * * *'
  watch:
    types: [started]
  workflow_dispatch:

jobs:
  build:
    name: Build and call API
    runs-on: ubuntu-26.04
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    concurrency:
      group: mso-e5-dev-auto-renew

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install requests

      - name: Call API
        shell: bash
        env:
          CONFIG_ID: ${{ secrets.CONFIG_ID }}
          CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          : "${CONFIG_ID:?Missing CONFIG_ID secret}"
          : "${CONFIG_KEY:?Missing CONFIG_KEY secret}"
          : "${REFRESH_TOKEN:?Missing REFRESH_TOKEN secret}"

          script="$(mktemp ./.auto-renew.XXXXXX.py)"
          trap 'rm -f -- "$script" Secret.txt' EXIT

          awk '
            { print }
            NR == 10 { print ENVIRON["CONFIG_ID"] }
            NR == 12 { print ENVIRON["CONFIG_KEY"] }
            NR == 14 { print ENVIRON["REFRESH_TOKEN"] }
          ' main.py > "$script"

          python "$script" >/dev/null 2>&1 || {
            echo "::error::main.py exited with status $?."
            exit 1
          }

      - name: Commit and push run timestamp
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          date -u '+%Y-%m-%d %H:%M:%S UTC' > time.log
          git add -- time.log
          if git diff --cached --quiet -- time.log; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update MSO E5 run timestamp' -- time.log
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
